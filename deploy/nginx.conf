# ==========================================================================
# 已经有 Nginx 时用的站点配置。
#
# 用法：把这份文件的内容并进你的 Nginx 配置，改掉 server_name 和证书路径，
# 然后 docker compose up -d vellum（只起应用，不起 Caddy）。
#
# 注意两处容易踩的坑：
#   1. client_max_body_size 必须大于 CHUNK_MB，否则分块上传会被 413 挡掉；
#   2. Connection / Upgrade 头不转发的话 WebSocket 连不上，消息就不会实时推送。
# ==========================================================================

upstream vellum_app {
    server 127.0.0.1:8787;
    keepalive 16;
}

# HTTP 一律跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 这里用 listen 上的 http2 参数而不是 `http2 on;`：
    # `http2 on;` 要 nginx ≥ 1.25.1，而 Ubuntu 24.04 自带的是 1.24，
    # 22.04 是 1.18 —— 在那些版本上它会让 nginx 直接起不来
    # （unknown directive "http2"），整台机器的站点一起挂。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.example.com;

    # 证书用 certbot 签发：
    #   certbot certonly --webroot -w /var/www/certbot -d chat.example.com
    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # 分块上传的单块大小由 CHUNK_MB 决定，这里必须留出余量。
    # 默认 CHUNK_MB=4，给到 64m 足够；把 CHUNK_MB 调大时这里要跟着调。
    client_max_body_size 64m;
    client_body_timeout 300s;

    # 大文件上传和下载不要中途被掐断
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://vellum_app;
        proxy_http_version 1.1;

        # 这三行是 WebSocket 能工作的前提，缺一个都会退化成不实时
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 让上传请求边收边转发，而不是先缓冲到磁盘
        proxy_request_buffering off;
    }

    # 文件下载走 Range 请求，关掉缓冲才能拖动进度条
    location /api/files/ {
        proxy_pass http://vellum_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

# 放在 http {} 块里（和 server 同级）
#
# 注意这里的 '' 要映射成空串而不是 close：普通人请求（不带 Upgrade 头）如果
# 被塞上 `Connection: close`，upstream 的 keepalive 16 就完全用不上了，
# 每个 API 请求都会新开一条到应用的 TCP 连接。WebSocket 升级仍然正常，
# 因为那条路径的 $http_upgrade 不是空串。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
